version: 2
updates:
  # Keeps the SHA-pinned actions current (the org requires full commit SHAs).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns: [ "*" ]

  # One grouped monthly PR; security updates still arrive on their own as soon as they exist.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns: [ "*" ]
